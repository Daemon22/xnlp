name: XNLP Professional Training Checks

on:
  push:
    branches: ["main", "professional-nlp-foundation"]
  pull_request:

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install test dependencies
        run: python -m pip install --upgrade pip pytest torch
      - name: Run regression tests
        env:
          PYTHONPATH: .
        run: python -m pytest -q tests/test_professional_training.py tests/test_tokenizer.py

  foundation-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: regression
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install test dependencies
        run: python -m pip install --upgrade pip pytest torch
      - name: Run linguistic foundation and API tests
        env:
          PYTHONPATH: .
        run: python -m pytest -q xnlp_language/tests/test_foundation.py xnlp_language/tests/test_http_api.py

  v2-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: foundation-tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install test dependencies
        run: python -m pip install --upgrade pip pytest torch
      - name: Run V2 checkpoint validation tests
        env:
          PYTHONPATH: .
        run: python -m pytest -q tests/test_v2_checkpoint.py
